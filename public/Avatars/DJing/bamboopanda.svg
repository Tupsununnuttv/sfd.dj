<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -32 200 276" width="200" height="276" role="img" aria-label="Panda dancing while facing the DJ booth">
<style>
  .all,.armL,.armR,.legL,.legR,.earL,.earR { transform-box:view-box; }
  .all { transform-origin:80px 238px; animation:bop .72s ease-in-out infinite; }
  .armL { transform-origin:50px 138px; animation:raiseL .72s ease-in-out infinite; }
  .armR { transform-origin:110px 138px; animation:raiseR .72s ease-in-out infinite; }
  .legL { transform-origin:66px 192px; animation:knee .72s ease-in-out infinite; }
  .legR { transform-origin:94px 192px; animation:knee .72s ease-in-out infinite .36s; }
  .earL { transform-origin:48px 45px; animation:ear .72s ease-in-out infinite; }
  .earR { transform-origin:112px 45px; animation:ear .72s ease-in-out infinite reverse; }
  .legL { transform-origin:66px 192px; animation:knee .72s ease-in-out infinite; }
  .legR { transform-origin:94px 192px; animation:knee .72s ease-in-out infinite .36s; }
  @keyframes bop { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-6px) rotate(2deg)} }
  @keyframes raiseL { 0%,100%{transform:rotate(26deg)} 50%{transform:rotate(58deg)} }
  @keyframes raiseR { 0%,100%{transform:rotate(-58deg)} 50%{transform:rotate(-26deg)} }
  @keyframes knee { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  @keyframes ear { 0%,100%{transform:rotate(0)} 50%{transform:rotate(5deg)} }
  @keyframes knee { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
