<style> .all, .headgrp, .tail, .legL, .legR, .earL, .earR, .blink, .armL, .armR, .glow, .led { transform-box: view-box; } .blink { transform-box: fill-box; transform-origin: center; } .glow { transform-box: fill-box; transform-origin: center; } .all { transform-origin: 80px 238px; } .headgrp { transform-origin: 80px 118px; } .tail { transform-origin: 112px 182px; } .earL { transform-origin: 58px 50px; } .earR { transform-origin: 102px 50px; } .armL { transform-origin: 50px 138px; } .armR { transform-origin: 110px 138px; } .legL { transform-origin: 66px 192px; } .legR { transform-origin: 94px 192px; } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } } @keyframes pump { 0%,100% { transform: translateY(0) scale(1.02,.97); } 50% { transform: translateY(-9px) scale(.99,1.02); } } @keyframes knee { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } } @keyframes fistL { 0%,100% { transform: rotate(128deg); } 50% { transform: rotate(160deg); } } @keyframes fistR { 0%,100% { transform: rotate(-160deg); } 50% { transform: rotate(-128deg); } } @keyframes bob { 0%,100% { transform: rotate(-6deg) translateY(0); } 50% { transform: rotate(6deg) translateY(4px); } } @keyframes wag { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg); } } @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } } .all { animation: pump .64s ease-in-out infinite; } .headgrp { animation: bob .64s ease-in-out infinite; } .armL { animation: fistL .64s ease-in-out infinite; } .armR { animation: fistR .64s ease-in-out infinite .32s; } .legL { animation: knee .64s ease-in-out infinite; } .legR { animation: knee .64s ease-in-out infinite .32s; } .tail { animation: wag .4s ease-in-out infinite; } .glow { animation: pulse .32s infinite; } .earL, .earR { animation: bob .64s ease-in-out infinite; } .led { animation: pulse .24s infinite; } .l2 { animation-delay: .08s; } .l3 { animation-delay: .16s; } .armL { transform: rotate(145deg); } .armR { transform: rotate(-145deg); } .headgrp { transform: rotate(-4deg); } .tail { transform: rotate(10deg); }</style>
