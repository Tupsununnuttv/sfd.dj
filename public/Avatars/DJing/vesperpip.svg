.wings{transform-origin:138px 138px;animation:wings 600ms ease-in-out infinite alternate}
.eyes{transform-origin:65px 81px;animation:blink 4800ms linear infinite}
.spark{animation:spark 1200ms ease-in-out infinite alternate}
