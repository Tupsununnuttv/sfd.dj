<svg xmlns="http://www.w3.org/2000/svg" width="200" height="276" viewBox="-20 -32 200 276" role="img" aria-labelledby="title desc"><title id="title">Vesper and Pip — djing</title><desc id="desc">Original snow leopard in a moon-patched bomber jacket with a lantern spirit companion. Back-facing rhythmic dance toward the DJ booth, without props.</desc><defs>
