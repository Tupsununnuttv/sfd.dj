<style> .all, .headgrp, .tail, .legL, .legR, .earL, .earR, .blink, .armL, .armR, .glow, .led { transform-box: view-box; } .blink { transform-box: fill-box; transform-origin: center; } .glow { transform-box: fill-box; transform-origin: center; } .all { transform-origin: 80px 238px; } .headgrp { transform-origin: 80px 118px; } .tail { transform-origin: 112px 182px; } .earL { transform-origin: 58px 50px; } .earR { transform-origin: 102px 50px; } .armL { transform-origin: 50px 138px; } .armR { transform-origin: 110px 138px; } .legL { transform-origin: 66px 192px; } .legR { transform-origin: 94px 192px; } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } } @keyframes hop { 0%,100% { transform: translateY(0) scale(1.03,.96); } 45% { transform: translateY(-11px) scale(.98,1.03); } } @keyframes hips { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } } @keyframes armLd { 0%,100% { transform: rotate(140deg); } 25% { transform: rotate(102deg); } 50% { transform: rotate(152deg); } 75% { transform: rotate(112deg); } } @keyframes armRd { 0%,100% { transform: rotate(-62deg); } 25% { transform: rotate(-140deg); } 50% { transform: rotate(-72deg); } 75% { transform: rotate(-132deg); } } @keyframes kneeL { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } } @keyframes wag { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(16deg); } } @keyframes nod { 0%,100% { transform: rotate(-5deg) translateY(0); } 50% { transform: rotate(5deg) translateY(3px); } } @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } } .all { animation: hop .66s ease-in-out infinite; } .headgrp { animation: nod 1.32s ease-in-out infinite; } .armL { animation: armLd 1.32s ease-in-out infinite; } .armR { animation: armRd 1.32s ease-in-out infinite; } .legL { animation: kneeL .66s ease-in-out infinite; } .legR { animation: kneeL .66s ease-in-out infinite .33s; } .tail { animation: wag .44s ease-in-out infinite; } .glow { animation: pulse .66s ease-in-out infinite; } .earL { animation: hips 1.32s ease-in-out infinite; } .earR { animation: hips 1.32s ease-in-out infinite reverse; } .led { animation: pulse .33s infinite; } .l2 { animation-delay: .1s; } .l3 { animation-delay: .2s; } .armL { transform: rotate(140deg); } .armR { transform: rotate(-62deg); } .legL { transform: translateY(-8px); } .headgrp { transform: rotate(-5deg); } .tail { transform: rotate(12deg); }</style>
