<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 276" width="200" height="276" role="img" aria-label="Rift, dancing">
<defs>
<linearGradient id="d-cloak" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#49388f"/><stop offset=".5" stop-color="#191943"/><stop offset="1" stop-color="#080b20"/></linearGradient>
<linearGradient id="d-feather" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#30dbf1"/><stop offset=".35" stop-color="#4540ac"/><stop offset="1" stop-color="#0a0b23"/></linearGradient>
