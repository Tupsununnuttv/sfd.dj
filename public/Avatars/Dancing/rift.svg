<style>.all,.head,.wing,.arm,.spark{transform-box:fill-box;transform-origin:center}@keyframes d-hop{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-13px) rotate(3deg)}}@keyframes d-nod{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}@keyframes d-wing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(9deg)}}@keyframes d-arm{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}@keyframes d-flash{0%,100%{opacity:.25;transform:scale(.5)}50%{opacity:1;transform:scale(1.2)}}.all{animation:d-hop .76s ease-in-out infinite}.head{animation:d-nod 1.52s ease-in-out infinite}.wing{animation:d-wing .76s ease-in-out infinite}.arm{animation:d-arm .76s ease-in-out infinite}.spark{animation:d-flash .76s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
