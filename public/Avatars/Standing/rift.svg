<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 276" width="200" height="276" role="img" aria-label="Rift, standing">
<defs>
<linearGradient id="rift-cloak" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#41327f"/><stop offset=".48" stop-color="#161638"/><stop offset="1" stop-color="#080b20"/></linearGradient>
<linearGradient id="rift-feather" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#314cba"/><stop offset=".55" stop-color="#171b5d"/><stop offset="1" stop-color="#080b20"/></linearGradient>
<linearGradient id="rift-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe7a0"/><stop offset=".45" stop-color="#d29542"/><stop offset="1" stop-color="#70401f"/></linearGradient>
<radialGradient id="rift-orb"><stop stop-color="#fff"/><stop offset=".18" stop-color="#b7f5ff"/><stop offset=".5" stop-color="#28c9ef"/><stop offset="1" stop-color="#5722ad"/></radialGradient>
<filter id="rift-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.all,.head,.orb,.staff,.star{transform-box:fill-box;transform-origin:center}@keyframes rift-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes rift-blink{0%,89%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}@keyframes rift-orbit{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}@keyframes rift-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes rift-twinkle{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}.all{animation:rift-breathe 3.2s ease-in-out infinite}.head{animation:rift-breathe 3.2s ease-in-out infinite reverse}.blink{transform-box:fill-box;transform-origin:center;animation:rift-blink 4.8s infinite}.orb{animation:rift-orbit 5s linear infinite}.staff{animation:rift-float 3.2s ease-in-out infinite}.star{animation:rift-twinkle 1.8s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
