<style> .all, .headgrp, .tail, .legL, .legR, .earL, .earR, .blink, .armL, .armR, .glow, .led { transform-box: view-box; } .blink { transform-box: fill-box; transform-origin: center; } .glow { transform-box: fill-box; transform-origin: center; } .all { transform-origin: 80px 238px; } .headgrp { transform-origin: 80px 118px; } .tail { transform-origin: 112px 182px; } .earL { transform-origin: 58px 50px; } .earR { transform-origin: 102px 50px; } .armL { transform-origin: 50px 138px; } .armR { transform-origin: 110px 138px; } .legL { transform-origin: 66px 192px; } .legR { transform-origin: 94px 192px; } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } } @keyframes breathe { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-1.5px) scale(1.012,1.018); } } @keyframes blink { 0%,90%,100% { transform: scaleY(1); } 94% { transform: scaleY(.08); } } @keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } } @keyframes armSway { 0%,100% { transform: rotate(2deg); } 50% { transform: rotate(-3deg); } } @keyframes earTwitch { 0%,86%,100% { transform: rotate(0); } 90% { transform: rotate(-9deg); } 95% { transform: rotate(3deg); } } .all { animation: breathe 3.2s ease-in-out infinite; } .blink { animation: blink 4.4s infinite; } .tail { animation: sway 3.6s ease-in-out infinite; } .armL { animation: armSway 3.2s ease-in-out infinite; } .armR { animation: armSway 3.2s ease-in-out infinite reverse; } .earL { animation: earTwitch 6s infinite; } .earR { animation: earTwitch 6s infinite 2.2s; }</style>
