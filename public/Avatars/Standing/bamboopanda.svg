<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -32 200 276" width="200" height="276" role="img" aria-label="Panda standing and nibbling bamboo">
<style>
  .all,.headgrp,.armL,.bamboo,.leaf,.mouthOpen { transform-box:view-box; }
  .all { transform-origin:80px 238px; animation:breathe 3s ease-in-out infinite; }
  .headgrp { transform-origin:80px 118px; animation:nod 1.8s ease-in-out infinite; }
  .armL { transform-origin:50px 140px; }
  .bamboo { transform-origin:64px 150px; animation:bite 1.8s ease-in-out infinite; }
  .leaf { transform-origin:68px 98px; animation:leafSway 2.2s ease-in-out infinite; }
  .mouthOpen { transform-box:fill-box; transform-origin:center; animation:chew .45s ease-in-out infinite alternate; }
  @keyframes breathe { 0%,100%{transform:translateY(0) scale(1,1)} 50%{transform:translateY(-1.5px) scale(1.01,1.015)} }
  @keyframes nod { 0%,100%{transform:rotate(0)} 45%,65%{transform:rotate(-3deg)} }
  @keyframes bite { 0%,100%{transform:rotate(0)} 45%,65%{transform:rotate(4deg)} }
  @keyframes leafSway { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(5deg)} }
  @keyframes chew { from{transform:scaleY(.65)} to{transform:scaleY(1.25)} }
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
